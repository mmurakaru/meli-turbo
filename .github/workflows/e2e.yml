name: E2E (web)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meli
          POSTGRES_USER: meliuser
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meliuser -d meli"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      # Throwaway CI-only values. Cortex calls are mocked inside the specs and
      # /pricing falls back to the default plans with this placeholder Stripe key.
      POSTGRES_URL: postgres://meliuser:pass@localhost:5432/meli
      BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      CORTEX_URL: http://localhost:3001
      CORTEX_JWT_PRIVATE_KEY: ci-placeholder-not-a-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate and seed database
        working-directory: apps/web
        run: |
          pnpm db:migrate
          # `pnpm db:seed` shells out to `npx tsx`, and tsx isn't a dependency
          pnpm dlx tsx lib/db/seed.ts

      - name: Run Playwright
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
