name: CI/CD
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 16.x

      - name: Git Init
        run: |
          git switch -c main
          git config --global user.email "mmurakaru@gmail.com"
          git config --global user.name "Markus Murakaru"

      - name: Test & Build
        run: |
          npm install
          npm run extension:release

      - name: Git Push
        uses: ad-m/github-push-action@master
        continue-on-error: true
        with:
          tags: true
          branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Build As Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Meli
          path: extension/build/meli.zip

      - name: Publish Chrome Extension
        uses: trmcnvn/chrome-addon@v2
        continue-on-error: true
        with:
          extension: cdockenadnadldjbbgcallicgledbeoc
          zip: extension/build/meli.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
